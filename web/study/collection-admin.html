<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IE416 연구자 화면</title>
  <link rel="stylesheet" href="/study/study.css">
  <script defer src="/study/collection-admin.js"></script>
</head>
<body>
<header class="app-header">
  <a class="brand" href="/admin"><span class="brand-mark">S</span><span>SUPERVISION LAB<small>IE416 · 연구자 화면</small></span></a>
  <a class="btn small" href="/">참가자 화면</a>
</header>
<main id="app">
  <section class="panel center-stage" id="login-panel" hidden>
    <div class="eyebrow">연구자 전용</div><h1>수집 관리 로그인</h1>
    <form id="login">
      <div class="field"><label for="username">아이디</label><input id="username" value="admin" autocomplete="username" required></div>
      <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit">로그인</button>
    </form>
  </section>
  <section id="dashboard" hidden>
    <div class="intro"><div class="eyebrow">IE416 · 응답 수집</div><h1>참가 세션 관리</h1><p>참가자마다 하나의 링크를 발급하고 진행 상태와 저장된 응답을 확인하세요.</p></div>
    <form class="panel setup-form" id="new-invite">
      <h2>참가 링크 발급</h2>
      <div class="field-row">
        <div class="field"><label for="participant">참가자 코드</label><input id="participant" placeholder="P001" autocomplete="off" pattern="[A-Za-z0-9_\-]{1,32}" maxlength="32" required></div>
        <div class="field"><label for="mode">실험 유형</label><select id="mode"><option value="pilot">파일럿</option><option value="main">본 실험</option></select></div>
      </div>
      <p class="subtle form-note">이름 대신 코드를 사용하세요. UI 조건은 서버에서 배정합니다.</p>
      <button class="btn primary" type="submit">링크 만들기</button>
      <div class="field" id="invite-result" hidden><label for="invite-link">개인 참가 링크</label>
        <input id="invite-link" type="url" readonly><button type="button" class="btn small" id="copy">링크 복사</button></div>
    </form>
    <section class="panel overview-panel collection-records" aria-labelledby="records-heading">
      <div class="panel-heading"><div><h2 id="records-heading">수집 현황</h2><p id="session-count">세션 확인 중</p></div>
        <div class="export-actions"><button type="button" class="btn small" id="refresh">새로고침</button>
          <a class="btn small" href="/results">팀원용 결과</a>
          <a class="btn small" href="/api/collection/admin/backup.zip">전체 결과 ZIP</a>
          <button type="button" class="btn small" id="logout">로그아웃</button></div></div>
      <div class="overview-content collection-table"><table class="protocol-table">
        <thead><tr><th scope="col">코드</th><th scope="col">유형</th><th scope="col">UI</th>
          <th scope="col">진행</th><th scope="col">참가 링크</th><th scope="col">기록 다운로드</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </section>
  <div id="notice" class="error-banner" role="status" hidden></div>
</main>
<footer class="app-footer"><span>IE416 · Multi robot supervision</span><span>연구자 접근 및 응답 수집</span></footer>
</body>
</html>
