<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IE416 팀원용 결과</title>
  <link rel="stylesheet" href="/study/study.css">
  <script defer src="/study/collection-results.js"></script>
</head>
<body>
<header class="app-header">
  <a class="brand" href="/results"><span class="brand-mark">S</span><span>SUPERVISION LAB<small>IE416 · 팀원용 결과</small></span></a>
  <a class="btn small" id="admin-link" href="/admin">관리자 로그인</a>
</header>
<main id="app">
  <section class="panel center-stage" id="login-panel" hidden>
    <div class="eyebrow">팀원 전용</div><h1>결과 조회 로그인</h1>
    <form id="login">
      <div class="field"><label for="username">아이디</label><input id="username" value="viewer" autocomplete="username" required></div>
      <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit">로그인</button>
    </form>
  </section>
  <section id="dashboard" hidden>
    <div class="intro"><div class="eyebrow">IE416 · 팀원용 결과</div><h1>실험 결과 요약</h1>
      <p>실험 유형, 프로토콜 버전, UI 조건별 완료 인원과 평균을 확인합니다.</p></div>
    <section class="panel overview-panel" aria-labelledby="results-heading">
      <div class="panel-heading"><div><h2 id="results-heading">조건별 집계</h2><p id="session-count"></p></div>
        <div class="export-actions"><button type="button" class="btn small" id="refresh">새로고침</button>
          <button type="button" class="btn small" id="logout">로그아웃</button></div></div>
      <div class="overview-content collection-table">
        <table class="protocol-table">
          <thead><tr><th scope="col">실험 · 버전</th><th scope="col">UI</th><th scope="col">완료 / 접수</th>
            <th scope="col">상황인식</th><th scope="col">균형 정확도</th><th scope="col">최종 순서 정확도</th><th scope="col">Raw TLX</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="subtle form-note">평균에는 실험을 완료하고 해당 지표의 값이 있는 참가자만 포함합니다. n은 지표별 집계 인원입니다.</p>
      </div>
    </section>
  </section>
  <div id="notice" class="error-banner" role="status" hidden></div>
</main>
<footer class="app-footer"><span>IE416 · Multi robot supervision</span><span>팀원용 결과 조회</span></footer>
</body>
</html>
